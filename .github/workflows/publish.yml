name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v1.0.0. Create the tag first.'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm test

      - run: RELEASE_MODE=true npm publish --provenance --access public
